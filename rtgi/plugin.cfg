[plugin]

name="RTGI"
description="Ray-traced global illumination. Adds an RTGI option to the Environment (WorldEnvironment) inspector next to SSR / SSAO and creates + loads the RTGI node automatically. Also adds a Godot 4 style SSAO and a per-pixel (JFA driven) motion blur."
author="RTGI"
version="1.5"
script="plugin.gd"
