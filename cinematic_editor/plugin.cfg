[plugin]

name="Cinematic Editor"
description="A 'Cinematic' main-screen tab for building 3D cutscenes in the open scene: camera shots, cuts and smooth camera moves, keyframes for any node (pick nodes from a list, edit position / rotation / scale, key AnimationPlayer animations), FOV changes, camera shake and Shakify (handheld motion), voice audio and subtitles (custom font), with a free-fly editor view next to the live result view (click cameras or nodes to select; G/R/S + X/Y/Z to move, rotate and scale like Blender; I keys the selection). Godot 3.x."
author=""
version="0.9.13"
script="plugin.gd"
